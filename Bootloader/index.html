<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>העלאת קוד</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100vh; display: flex; flex-direction: column; font-family: monospace; }
    .main { display: flex; flex: 1; width: 100%; height: calc(100vh - 60px); }
    textarea { flex: 1; height: 100%; padding: 10px; font-family: monospace; font-size: 14px; background: #1e1e1e; color: #fff; border: none; resize: none; direction: ltr; outline: none; }
    .console { flex: 1; height: 100%; padding: 10px; background: #000; color: #0f0; font-family: monospace; font-size: 14px; overflow-y: auto; direction: ltr; white-space: pre-wrap; border-right: 1px solid #333; }
    .footer { height: 60px; display: flex; align-items: center; justify-content: center; background: #222; }
    button { padding: 12px 40px; font-size: 18px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    button:disabled { background: #555; cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="main">
    <textarea id="code" spellcheck="false">void setup() {
  pinMode(33, OUTPUT);
}

void loop() {
  digitalWrite(33, HIGH);
  delay(500);
  digitalWrite(33, LOW);
  delay(500);
}</textarea>
    <div id="console" class="console">Ready...</div>
  </div>

  <div class="footer">
    <button id="uploadBtn">העלה</button>
  </div>

  <script>
    const codeEl = document.getElementById('code');
    const consoleEl = document.getElementById('console');
    const uploadBtn = document.getElementById('uploadBtn');

    function log(msg) {
      consoleEl.textContent += '\n' + msg;
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    async function trigger1200BaudReset() {
      if (!("serial" in navigator)) return;
      try {
        log("Sending 1200-baud reset to enter Bootloader...");
        const port = await navigator.serial.requestPort();
        await port.open({ baudRate: 1200 });
        await new Promise(r => setTimeout(r, 150));
        await port.close();
        log("Board reset to Bootloader mode!");
      } catch (err) {
        log("Serial Reset Note: " + err.message);
      }
    }

    uploadBtn.addEventListener('click', async () => {
      const code = codeEl.value.trim();
      if (!code) return log("No code entered.");

      uploadBtn.disabled = true;
      consoleEl.textContent = "Compiling...";

      const endpoints = [
        'http://localhost:8000/compile',
        'https://web-compiler-api.onrender.com/compile'
      ];

      let blob = null;
      for (const ep of endpoints) {
        try {
          log("Connecting to " + ep + "...");
          // שימוש ב-text/plain כדי למנוע חסימות CORS Preflight (OPTIONS) בפתיחה כ-file://
          const res = await fetch(ep, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ code })
          });

          if (res.ok) {
            blob = await res.blob();
            log("Success!");
            break;
          } else {
            const errText = await res.text();
            let errMsg = errText;
            try {
              const errJson = JSON.parse(errText);
              errMsg = errJson.errors || errJson.message || errJson.detail || errText;
            } catch(e) {}
            log("Error:\n" + errMsg);
            uploadBtn.disabled = false;
            return;
          }
        } catch (e) {
          log("Failed to reach " + ep + ": " + e.message);
        }
      }

      if (blob) {
        await trigger1200BaudReset();

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'firmware.bin';
        a.click();
        URL.revokeObjectURL(url);
        log("Downloaded firmware.bin");
      } else {
        log("❌ לא ניתן להתחבר לשרת הקומפילציה.");
        log("טיפ: אם ה-API המקומי לא רץ ב-localhost:8000, ודא הפעלה של שרת ה-API (uvicorn) או המתן להתעוררות שרת הענן (Render).");
      }

      uploadBtn.disabled = false;
    });
  </script>

</body>
</html>

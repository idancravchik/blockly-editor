<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>העלאת קוד</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100vh; display: flex; flex-direction: column; font-family: monospace; }
    .main { display: flex; flex: 1; width: 100%; height: calc(100vh - 60px); }
    textarea { flex: 1; height: 100%; padding: 10px; font-family: monospace; font-size: 14px; background: #1e1e1e; color: #fff; border: none; resize: none; direction: ltr; outline: none; }
    .console { flex: 1; height: 100%; padding: 10px; background: #000; color: #0f0; font-family: monospace; font-size: 14px; overflow-y: auto; direction: ltr; white-space: pre-wrap; border-right: 1px solid #333; }
    .footer { height: 60px; display: flex; align-items: center; justify-content: center; background: #222; }
    button { padding: 12px 40px; font-size: 18px; font-weight: bold; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    button:disabled { background: #555; cursor: not-allowed; }
  </style>
  <script src="ch55xbl.js"></script>
</head>
<body>

  <div class="main">
    <textarea id="code" spellcheck="false">void setup() {
  pinMode(33, OUTPUT);
}

void loop() {
  digitalWrite(33, HIGH);
  delay(500);
  digitalWrite(33, LOW);
  delay(500);
}</textarea>
    <div id="console" class="console">Ready...</div>
  </div>

  <div class="footer">
    <button id="uploadBtn">העלה</button>
  </div>

  <script>
    const codeEl = document.getElementById('code');
    const consoleEl = document.getElementById('console');
    const uploadBtn = document.getElementById('uploadBtn');

    function log(msg) {
      consoleEl.textContent += '\n' + msg;
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    window.statusDiv = {
      set innerHTML(msg) {
        log("[WebUSB Flasher] " + msg);
      },
      get innerHTML() {
        return "";
      }
    };

    uploadBtn.addEventListener('click', async () => {
      const code = codeEl.value.trim();
      if (!code) return log("No code entered.");

      // 1. קבלת הרשאת יציאת טורית בלחיצת המשתמש במידת הצורך
      let serialPorts = [];
      if ("serial" in navigator) {
        try {
          serialPorts = await navigator.serial.getPorts();
          if (serialPorts.length === 0) {
            try {
              const p = await navigator.serial.requestPort();
              serialPorts = [p];
            } catch (e) {}
          }
        } catch (e) {}
      }

      uploadBtn.disabled = true;
      consoleEl.textContent = "Compiling...";

      // 2. קומפילציה מול ה-API
      const endpoints = [
        'http://localhost:8000/compile',
        'https://web-compiler-api.onrender.com/compile'
      ];

      let arrayBuffer = null;
      for (const ep of endpoints) {
        try {
          log("Connecting to " + ep + "...");
          const res = await fetch(ep, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ code })
          });

          if (res.ok) {
            arrayBuffer = await res.arrayBuffer();
            log("Compilation Success!");
            break;
          } else {
            const errText = await res.text();
            let errMsg = errText;
            try {
              const errJson = JSON.parse(errText);
              errMsg = errJson.errors || errJson.message || errJson.detail || errText;
            } catch(e) {}
            log("Error:\n" + errMsg);
            uploadBtn.disabled = false;
            return;
          }
        } catch (e) {
          log("Failed to reach " + ep + ": " + e.message);
        }
      }

      if (!arrayBuffer) {
        log("❌ לא ניתן להתחבר לשרת הקומפילציה.");
        uploadBtn.disabled = false;
        return;
      }

      const binBytes = new Uint8Array(arrayBuffer);

      // 3. ניסיון איפוס 1200-baud בסריאל להעברת הבקר למצב Bootloader
      if (serialPorts.length > 0) {
        try {
          log("Sending 1200-baud reset signal via Serial...");
          const port = serialPorts[0];
          if (port.readable || port.writable) {
            await port.close().catch(() => {});
          }
          await port.open({ baudRate: 1200 });
          await new Promise(r => setTimeout(r, 150));
          await port.close().catch(() => {});
          log("Serial reset sent. Waiting for USB Bootloader mode...");
          await new Promise(r => setTimeout(r, 1000));
        } catch (err) {
          log("Serial Reset Note: " + err.message);
        }
      }

      // 3. צריבה ישירה לזיכרון ה-Flash של CH552 דרך WebUSB
      try {
        log("Connecting to CH552 Bootloader via WebUSB...");
        await connectCH55xBootloader();

        if (bootloaderUploadReady) {
          log("Flashing binary directly into CH552 flash memory...");
          await uploadCH55xBootloader(binBytes);
          log("🎉 הצריבה הושלמה בהצלחה! הקוד הותקן ורץ כעת בלוח.");
        } else {
          log("❌ הלוח לא נמצא במצב Bootloader. ודא כי הלוח במצב צריבה.");
        }
      } catch (err) {
        log("WebUSB Flashing Error: " + err.message);
      }

      uploadBtn.disabled = false;
    });
  </script>

</body>
</html>

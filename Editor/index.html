<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
    <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
    <script src="https://unpkg.com/blockly/msg/en.js"></script>
    <script src="https://unpkg.com/@blockly/plugin-continuous-toolbox"></script>
    <link rel="stylesheet" href="style.css">
    <title>עורך בלוקים - DevboxV1</title>
  </head>

  <body>
      <div class="header-container">
          <h1>עורך בלוקים DevboxV1</h1>
          <div class="toolbar">
              <button id="copyBtn" class="btn btn-secondary">📋 העתק קוד</button>
              <button id="downloadBtn" class="btn btn-secondary">💾 הורד קוד C</button>
              <button id="compileBtn" class="btn btn-success">⚡ קמפל קוד (API)</button>
          </div>
      </div>

      <div id="statusBanner"></div>

      <div class="main-layout">
          <div id="blocklyDiv"></div>
          
          <div class="output-container">
              <div class="output-header">קוד C / Arduino שנוצר בלייב:</div>
              <pre id="codeOutput" dir="ltr">// גרור בלוקים כדי לראות את הקוד כאן...</pre>
          </div>
      </div>

      <!-- טעינת הגנרטורים לפני התסריט הראשי -->
      <script src="logic.js"></script>
      <script src="script.js"></script>

      <script>
          // טיפול בפעולות הכפתורים בממשק העורך
          const copyBtn = document.getElementById('copyBtn');
          const downloadBtn = document.getElementById('downloadBtn');
          const compileBtn = document.getElementById('compileBtn');
          const statusBanner = document.getElementById('statusBanner');
          const codeOutput = document.getElementById('codeOutput');

          function showStatus(message, type) {
              statusBanner.style.display = 'block';
              statusBanner.className = 'status-' + type;
              statusBanner.innerText = message;
          }

          function hideStatus() {
              statusBanner.style.display = 'none';
          }

          copyBtn.addEventListener('click', async () => {
              const code = codeOutput.innerText;
              if (!code || code.trim() === '' || code.startsWith('// גרור בלוקים')) {
                  showStatus('אין קוד להעתקה. הגדר בלוקים במשטח העבודה.', 'error');
                  return;
              }
              try {
                  await navigator.clipboard.writeText(code);
                  showStatus('הקוד הועתק בהצלחה ללוח!', 'success');
                  setTimeout(hideStatus, 3000);
              } catch (err) {
                  showStatus('שגיאה בהעתקה: ' + err.message, 'error');
              }
          });

          downloadBtn.addEventListener('click', () => {
              const code = codeOutput.innerText;
              if (!code || code.trim() === '' || code.startsWith('// גרור בלוקים')) {
                  showStatus('אין קוד להורדה. הגדר בלוקים במשטח העבודה.', 'error');
                  return;
              }
              const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = 'sketch.ino';
              a.click();
              URL.revokeObjectURL(url);
              showStatus('הקובץ sketch.ino יורד כעת.', 'success');
              setTimeout(hideStatus, 3000);
          });

          compileBtn.addEventListener('click', async () => {
              const code = codeOutput.innerText;
              if (!code || code.trim() === '' || code.startsWith('// גרור בלוקים')) {
                  showStatus('אין קוד לקומפילציה. הגדר בלוקים במשטח העבודה.', 'error');
                  return;
              }

              showStatus('שולח לקומפילציה בשרת API...', 'info');

              try {
                  const response = await fetch('http://localhost:8000/compile', {
                      method: 'POST',
                      headers: {
                          'Content-Type': 'application/json'
                      },
                      body: JSON.stringify({ code: code })
                  });

                  if (response.ok) {
                      const blob = await response.blob();
                      const url = URL.createObjectURL(blob);
                      const a = document.createElement('a');
                      a.href = url;
                      a.download = 'firmware.bin';
                      a.click();
                      URL.revokeObjectURL(url);
                      showStatus('הקומפילציה הושלמה בהצלחה! קובץ firmware.bin יורד.', 'success');
                  } else {
                      const errData = await response.json();
                      const errMsg = errData.errors || errData.message || 'שגיאת קומפילציה לא ידועה';
                      showStatus('שגיאת קומפילציה:\n' + errMsg, 'error');
                  }
              } catch (err) {
                  showStatus('שגיאה בתקשורת עם שרת ה-API: ' + err.message + '\nוודא ששרת ה-API פעיל ב-http://localhost:8000', 'error');
              }
          });
      </script>
  </body>
</html>

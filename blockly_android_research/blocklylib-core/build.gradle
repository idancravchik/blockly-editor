apply plugin: 'com.android.library'

android {
    namespace 'com.google.blockly.android'
    compileSdk 34

    defaultConfig {
        minSdk 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    flavorDimensions = ['blockly']
    productFlavors {
        full {
            dimension 'blockly'
        }
        lite {
            dimension 'blockly'
        }
    }

    sourceSets {
        lite {
            assets.srcDirs = ['src/lite/assets']
        }
        full {
            assets.srcDirs = ['src/lite/assets', 'src/full/assets']
        }
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'LICENSE.txt'
        }
    }
}

dependencies {
    api 'androidx.appcompat:appcompat:1.6.1'
    api 'androidx.recyclerview:recyclerview:1.3.2'
    api 'androidx.annotation:annotation:1.7.0'
    api 'androidx.fragment:fragment:1.6.2'
    api 'androidx.drawerlayout:drawerlayout:1.2.0'
    
    testImplementation 'junit:junit:4.13.2'
}

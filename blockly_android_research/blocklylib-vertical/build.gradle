apply plugin: 'com.android.library'

android {
    namespace 'com.google.blockly.android.ui.vertical'
    compileSdk 34

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    flavorDimensions = ['blockly']
    productFlavors {
        full {
            dimension 'blockly'
        }
        lite {
            dimension 'blockly'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    api project(':blocklylib-core')
}

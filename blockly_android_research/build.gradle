// Top-level build file for modern Android Studio (AGP 9.3.2 / Gradle 9.5.0, Android Studio Quail 3 2026.1.3)
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }


    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:unchecked"
        }
    }
}

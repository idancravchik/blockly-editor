<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="425" y="42" text-anchor="middle" fill="#38bdf8" font-size="24" font-weight="bold" letter-spacing="1">DEVBOX V1 - PINOUT &amp; WIRING DIAGRAM</text>
  <text x="425" y="68" text-anchor="middle" fill="#94a3b8" font-size="14">CH552G Dual JST-PH 2.0 Expansion Architecture</text>

  <!-- Main Board Outline -->
  <rect x="260" y="100" width="330" height="340" rx="16" fill="url(#boardGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)"/>
  
  <!-- USB-C Port -->
  <rect x="375" y="88" width="100" height="24" rx="6" fill="#64748b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="425" y="104" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="bold">USB TYPE-C</text>

  <!-- MCU Label -->
  <rect x="365" y="210" width="120" height="80" rx="8" fill="#0284c7" opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="425" y="245" text-anchor="middle" fill="#38bdf8" font-size="16" font-weight="bold">CH552G</text>
  <text x="425" y="268" text-anchor="middle" fill="#cbd5e1" font-size="12">USB HID Bootloader</text>

  <!-- Reset Button -->
  <circle cx="425" cy="335" r="16" fill="#f59e0b" stroke="#fbbf24" stroke-width="2"/>
  <circle cx="425" cy="335" r="9" fill="#d97706"/>
  <text x="425" y="368" text-anchor="middle" fill="#cbd5e1" font-size="11" font-weight="bold">RESET / BOOT</text>

  <!-- PORT 1 (Left JST-PH) -->
  <rect x="245" y="160" width="30" height="110" rx="4" fill="#f43f5e" stroke="#fda4af" stroke-width="1.5"/>
  <text x="210" y="145" text-anchor="middle" fill="#fda4af" font-size="14" font-weight="bold">PORT 1</text>
  
  <!-- Port 1 Pins -->
  <!-- Pin 1: GND -->
  <circle cx="245" cy="180" r="5" fill="#64748b"/>
  <line x1="240" y1="180" x2="130" y2="180" stroke="#64748b" stroke-width="2"/>
  <text x="120" y="184" text-anchor="end" fill="#94a3b8" font-size="12" font-family="monospace">GND</text>
  
  <!-- Pin 2: 3.3V -->
  <circle cx="245" cy="205" r="5" fill="#ef4444"/>
  <line x1="240" y1="205" x2="130" y2="205" stroke="#ef4444" stroke-width="2"/>
  <text x="120" y="209" text-anchor="end" fill="#f87171" font-size="12" font-family="monospace">3.3V (VCC)</text>
  
  <!-- Pin 3: P1.5 (Main/PWM/SDA) -->
  <circle cx="245" cy="230" r="5" fill="#38bdf8"/>
  <line x1="240" y1="230" x2="130" y2="230" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="120" y="234" text-anchor="end" fill="#38bdf8" font-size="12" font-family="monospace">P1.5 (Main / PWM / SDA)</text>
  
  <!-- Pin 4: P1.7 (Sec) -->
  <circle cx="245" cy="255" r="5" fill="#a855f7"/>
  <line x1="240" y1="255" x2="130" y2="255" stroke="#a855f7" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="120" y="259" text-anchor="end" fill="#c084fc" font-size="12" font-family="monospace">P1.7 (Secondary)</text>

  <!-- Left Modules Box -->
  <rect x="30" y="290" width="180" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="120" y="315" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">PORT 1 PERIPHERALS</text>
  <text x="45" y="340" fill="#94a3b8" font-size="12">&#8226; Servo Motor (PWM)</text>
  <text x="45" y="362" fill="#94a3b8" font-size="12">&#8226; Tactile Push Button</text>
  <text x="45" y="384" fill="#94a3b8" font-size="12">&#8226; Piezo Buzzer</text>
  <text x="45" y="406" fill="#94a3b8" font-size="12">&#8226; DHT11 / DHT22 Sensor</text>

  <!-- PORT 2 (Right JST-PH) -->
  <rect x="575" y="160" width="30" height="110" rx="4" fill="#10b981" stroke="#6ee7b7" stroke-width="1.5"/>
  <text x="640" y="145" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="bold">PORT 2</text>

  <!-- Port 2 Pins -->
  <!-- Pin 1: GND -->
  <circle cx="605" cy="180" r="5" fill="#64748b"/>
  <line x1="605" y1="180" x2="720" y2="180" stroke="#64748b" stroke-width="2"/>
  <text x="730" y="184" text-anchor="start" fill="#94a3b8" font-size="12" font-family="monospace">GND</text>
  
  <!-- Pin 2: 3.3V -->
  <circle cx="605" cy="205" r="5" fill="#ef4444"/>
  <line x1="605" y1="205" x2="720" y2="205" stroke="#ef4444" stroke-width="2"/>
  <text x="730" y="209" text-anchor="start" fill="#f87171" font-size="12" font-family="monospace">3.3V (VCC)</text>
  
  <!-- Pin 3: P1.4 (Main) -->
  <circle cx="605" cy="230" r="5" fill="#38bdf8"/>
  <line x1="605" y1="230" x2="720" y2="230" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="730" y="234" text-anchor="start" fill="#38bdf8" font-size="12" font-family="monospace">P1.4 (Main / I/O)</text>
  
  <!-- Pin 4: P1.6 (Sec/SCL) -->
  <circle cx="605" cy="255" r="5" fill="#a855f7"/>
  <line x1="605" y1="255" x2="720" y2="255" stroke="#a855f7" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="730" y="259" text-anchor="start" fill="#c084fc" font-size="12" font-family="monospace">P1.6 (Sec / SCL)</text>

  <!-- Right Modules Box -->
  <rect x="640" y="290" width="180" height="130" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="730" y="315" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="bold">PORT 2 PERIPHERALS</text>
  <text x="655" y="340" fill="#94a3b8" font-size="12">&#8226; Secondary Servo</text>
  <text x="655" y="362" fill="#94a3b8" font-size="12">&#8226; Digital Button / Switch</text>
  <text x="655" y="384" fill="#94a3b8" font-size="12">&#8226; Output LED / Indicator</text>
  <text x="655" y="406" fill="#94a3b8" font-size="12">&#8226; Secondary Sensor</text>

  <!-- Bottom Dimensions -->
  <text x="425" y="425" text-anchor="middle" fill="#64748b" font-size="11">Board Dimensions: 30mm x 45mm | Dual 2.0mm JST-PH Expansion Ports</text>
</svg>